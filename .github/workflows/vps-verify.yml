name: Studium VPS Configuration Verification

on:
  push:
    branches:
      - deploy/lms-vps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studium-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-vps-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify startup and seed scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/scripts/local/start-local.sh
          bash -n infra/scripts/local/seed-demo.sh
          bash -n infra/scripts/vps/deploy-vps.sh
          if grep -Fq "printf '%s' \"\$workflow_questions_json\" | python3 <<'PY'" infra/scripts/local/seed-demo.sh; then
            echo "Broken Python heredoc stdin pattern detected" >&2
            exit 1
          fi
          if grep -Fq 'rg -q' infra/scripts/local/start-local.sh; then
            echo "Unexpected ripgrep prerequisite" >&2
            exit 1
          fi

      - name: Validate isolated Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          cp .env.example .env
          mkdir -p .secrets
          printf 'test-placeholder-token\n' > .secrets/cloudflare-tunnel.token
          docker compose --env-file .env \
            -f infra/docker/docker-compose.local.yml \
            -f infra/docker/docker-compose.vps.yml \
            config --format json > /tmp/studium-compose.json
          python3 - <<'PY'
          import json

          with open("/tmp/studium-compose.json", encoding="utf-8") as handle:
              stack = json.load(handle)

          assert stack["name"] == "studium-lms", stack["name"]
          services = stack["services"]
          forbidden = ("postgres", "pgbouncer", "redis", "kafka", "minio")
          for name in forbidden:
              assert not services[name].get("ports"), f"{name} is exposed"
          assert all(
              item.get("host_ip") == "127.0.0.1"
              for item in services["service-lb"].get("ports", [])
          ), "HAProxy ports must bind to 127.0.0.1"
          for name, service in services.items():
              if name != "service-lb":
                  assert not service.get("ports"), f"{name} exposes ports"
          assert "cloudflared" in services
          assert "frontend" in services
          assert "gateway" in services
          assert "cloudflare_tunnel_token" in stack.get("secrets", {})
          # Each Spring Boot service must bypass transaction-pooled PgBouncer:
          # its per-session PostgreSQL search_path is required by Flyway.
          java_services = (
              "auth-service", "profile-service", "education-service",
              "schedule-service", "assignment-service", "content-service",
              "testing-service", "file-service", "analytics-service",
              "audit-service", "notification-service", "telegram-bot-service",
              "gateway",
          )
          for name in java_services:
              env = services[name]["environment"]
              assert env.get("POSTGRES_HOST") == "postgres", (name, env.get("POSTGRES_HOST"))
              assert str(env.get("POSTGRES_PORT")) == "5432", (name, env.get("POSTGRES_PORT"))
          print("Compose isolation and direct PostgreSQL checks passed")
          PY

  verify-storage-image:
    needs: verify-vps-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify pinned MinIO image is pullable and includes mc
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p .secrets
          printf 'test-placeholder-token\n' > .secrets/cloudflare-tunnel.token
          docker compose --env-file .env \
            -f infra/docker/docker-compose.local.yml \
            -f infra/docker/docker-compose.vps.yml \
            config --format json > /tmp/studium-storage-config.json
          image="$(python3 - <<'PY'
          import json
          with open("/tmp/studium-storage-config.json", encoding="utf-8") as handle:
              services = json.load(handle)["services"]
          server = services["minio"]["image"]
          client = services["minio-init"]["image"]
          assert server == client, (server, client)
          assert "@sha256:" in server, server
          print(server)
          PY
          )"
          docker pull "$image"
          docker run --rm --entrypoint /bin/sh "$image" -c 'command -v minio && command -v mc && command -v curl'
          echo "Pinned MinIO image is ready for server and bucket initialization"

  build-backend:
    needs: verify-vps-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile all runtime services
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            :apps:auth-service:bootJar \
            :apps:profile-service:bootJar \
            :apps:education-service:bootJar \
            :apps:schedule-service:bootJar \
            :apps:assignment-service:bootJar \
            :apps:content-service:bootJar \
            :apps:testing-service:bootJar \
            :apps:file-service:bootJar \
            :apps:analytics-service:bootJar \
            :apps:audit-service:bootJar \
            :apps:notification-service:bootJar \
            :apps:telegram-bot-service:bootJar \
            :apps:gateway:bootJar
