name: studium-lms

# Requires Docker Compose 2.24.4+ for !override.
# Memory limits protect the existing Mnemos services on the same VPS.
x-studium-java-memory: &studium-java-memory
  mem_limit: 768m
  mem_reservation: 256m

# Use direct PostgreSQL: transaction-pooled PgBouncer can lose Flyway/JDBC search_path
# settings between transactions, leaving migrations recorded in the requested
# schema while unqualified CREATE TABLE statements land in public.
x-studium-java-environment: &studium-java-environment
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:
  postgres:
    mem_limit: 1024m
    ports: !reset []
    restart: unless-stopped
  pgbouncer:
    mem_limit: 256m
    ports: !reset []
    restart: unless-stopped
  redis:
    mem_limit: 512m
    ports: !reset []
    restart: unless-stopped
  kafka:
    mem_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    ports: !reset []
    restart: unless-stopped
  minio:
    mem_limit: 1024m
    ports: !reset []
    restart: unless-stopped

  service-lb:
    mem_limit: 192m
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
      - "127.0.0.1:${FRONTEND_PORT:-13000}:3000"
    restart: unless-stopped

  auth-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  profile-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  education-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  schedule-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  assignment-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  content-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  testing-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  file-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  analytics-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  audit-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  notification-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  telegram-bot-service:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped
  gateway:
    <<: *studium-java-memory
    environment:
      <<: *studium-java-environment
    restart: unless-stopped

  frontend:
    mem_limit: 256m
    volumes:
      - ./nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cloudflared:
    mem_limit: 256m
    image: cloudflare/cloudflared:2026.8.1
    # Compose local-file secrets are bind mounts; uid/gid/mode are not remapped.
    # Keep the source token chmod 600; read it as root with only DAC_OVERRIDE.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      - service-lb
    restart: unless-stopped

secrets:
  cloudflare_tunnel_token:
    file: ../../.secrets/cloudflare-tunnel.token
